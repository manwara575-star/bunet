services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: videosecurity-mediamtx
    environment:
      # Browser WebRTC ICE candidates need a host/IP reachable by the browser.
      # Use "localhost" for local Docker Compose; set to your public hostname/IP behind a proxy.
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-localhost}"
    expose:
      - "8554" # RTSP ingest from the ASP.NET/FFmpeg container only
      - "8889" # internal WHEP endpoint proxied by ASP.NET
    ports:
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-8189}:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  web:
    build: .
    container_name: videosecurity-web
    depends_on:
      - mediamtx
    ports:
      - "${HOST_PORT:-5102}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Hosting__DisableHttpsRedirection: "true"
      Hosting__AllowInsecureCookies: "true"
      ConnectionStrings__DefaultConnection: "Data Source=/data/videosecurity.db"
      Bunny__LibraryId: "${BUNNY_LIBRARY_ID:-0}"
      Bunny__ApiKey: "${BUNNY_API_KEY:-}"
      Bunny__EmbedTokenKey: "${BUNNY_EMBED_TOKEN_KEY:-}"
      Bunny__CdnHostname: "${BUNNY_CDN_HOSTNAME:-vz-replace-me.b-cdn.net}"
      Bunny__CdnTokenKey: "${BUNNY_CDN_TOKEN_KEY:-}"
      Bunny__PrivacyHashPepper: "${PRIVACY_HASH_PEPPER:-}"
      Bunny__WebhookSecret: "${BUNNY_WEBHOOK_SECRET:-}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@cifm.polytronx.com}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      Embed__AllowedDomains: "${EMBED_ALLOWED_DOMAINS:-cifm.polytronx.com}"
      Embed__PublicBaseUrl: "${EMBED_PUBLIC_BASE_URL:-https://cifm.polytronx.com}"
      ProtectedMedia__RootPath: "/data/protected-media"
      ProtectedMedia__MaxSourceBytes: "${PROTECTED_MEDIA_MAX_SOURCE_BYTES:-10737418240}"
      SecurePlayback__Enabled: "${SECURE_PLAYBACK_ENABLED:-true}"
      SecurePlayback__WhepEndpointTemplate: "${SECURE_PLAYBACK_WHEP_ENDPOINT_BASE:-http://mediamtx:8889}/{sessionId}/whep"
      SecurePlayback__WhepBearerToken: "${SECURE_PLAYBACK_WHEP_BEARER_TOKEN:-}"
      SecurePlayback__StartFfmpegOnSessionCreate: "${SECURE_PLAYBACK_START_FFMPEG:-true}"
      SecurePlayback__FfmpegPath: "${SECURE_PLAYBACK_FFMPEG_PATH:-ffmpeg}"
      SecurePlayback__RtspPublishUrlTemplate: "${SECURE_PLAYBACK_RTSP_PUBLISH_BASE:-rtsp://mediamtx:8554}/{sessionId}"
      SecurePlayback__BurnWatermark: "${SECURE_PLAYBACK_BURN_WATERMARK:-true}"
      SecurePlayback__WatermarkFontSize: "${SECURE_PLAYBACK_WATERMARK_FONT_SIZE:-28}"
      SecurePlayback__VideoPreset: "${SECURE_PLAYBACK_VIDEO_PRESET:-superfast}"
      SecurePlayback__VideoMaxRate: "${SECURE_PLAYBACK_VIDEO_MAX_RATE:-2200k}"
      SecurePlayback__VideoBufferSize: "${SECURE_PLAYBACK_VIDEO_BUFFER_SIZE:-4400k}"
      SecurePlayback__OutputFrameRate: "${SECURE_PLAYBACK_OUTPUT_FRAME_RATE:-25}"
      SecurePlayback__AudioBitrate: "${SECURE_PLAYBACK_AUDIO_BITRATE:-96k}"
      SecurePlayback__StaleSessionTimeout: "${SECURE_PLAYBACK_STALE_SESSION_TIMEOUT:-00:00:45}"
    volumes:
      - videosec-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "3", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  videosec-data:
